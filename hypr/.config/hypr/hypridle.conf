general {
    lock_cmd = pidof swaylock || swaylock       # dbus/sysd lock command (loginctl lock-session)
    unlock_cmd = notify-send "unlock!"          # same as above, but unlock
    before_sleep_cmd = loginctl lock-session; hyprctl dispatch 'hl.dsp.dpms({ on })'; sleep 2    # command ran before sleep
    after_sleep_cmd = sleep 2 && hyprctl dispatch 'hl.dsp.dpms({ on })' # wait for NVIDIA resume, then restore displays
    ignore_dbus_inhibit = false                 # ignore dbus idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false              # ignore systemd-inhibit --what=idle inhibitors
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ off })' # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ on })'   # screen on when activity is detected
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl hibernate              # Save state to disk and power off
}
