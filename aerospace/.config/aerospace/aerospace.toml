config-version = 2

# Start AeroSpace at login
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = false

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = true

[workspace-to-monitor-force-assignment]
1-ghostty = 1
2-firefox = 1
3-obsidian = 1
4-orbstack = 1
5 = 1
6-zoom = 1
7-slack = 2
8-huddle = 2
9-music = 2

firefox-personal = 1
chrome = '1'

[key-mapping]
    preset = 'qwerty'

[mode.main.binding]
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1-ghostty'
    alt-2 = 'workspace 2-firefox'
    alt-3 = 'workspace 3-obsidian'
    alt-4 = 'workspace 4-orbstack'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6-zoom'
    alt-7 = 'workspace 7-slack'
    alt-8 = 'workspace 8-huddle'
    alt-9 = 'workspace 9-music'

    alt-f = 'workspace firefox-personal'
    alt-c = 'workspace chrome'

    alt-shift-1 = 'move-node-to-workspace 1-ghostty'
    alt-shift-2 = 'move-node-to-workspace 2-firefox'
    alt-shift-3 = 'move-node-to-workspace 3-obsidian'
    alt-shift-4 = 'move-node-to-workspace 4-orbstack'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6-zoom'
    alt-shift-7 = 'move-node-to-workspace 7-slack'
    alt-shift-8 = 'move-node-to-workspace 8-huddle'
    alt-shift-9 = 'move-node-to-workspace 9-music'

    alt-shift-f = 'move-node-to-workspace firefox-personal'
    alt-shift-c = 'move-node-to-workspace chrome'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 7-slack'

#[[on-window-detected]]
#if.app-id = 'com.tinyspeck.slackmacgap'
#if.window-title-regex-substring = "*Huddle*"
#run = 'move-node-to-workspace 8-huddle'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace chrome'

[[on-window-detected]]
if.app-id = 'dev.kdrag0n.MacVirt'
run = 'move-node-to-workspace 4-orbstack'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'move-node-to-workspace 6-zoom'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace firefox-personal'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefoxdeveloperedition'
run = 'move-node-to-workspace 2-firefox'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 3-obsidian'

[[on-window-detected]]
if.app-id = 'org.jeffvli.feishin'
run = 'move-node-to-workspace 9-music'
